services:
  imapsync:
    build: .
    container_name: imapsync
    restart: always
    volumes:
      - ./logs:/var/log/imapsync
    secrets:
      - password_corporativo_junta
      - password_geducaand
    env_file:
      # Opcional: sin .env el script usa sus valores por defecto y avisa
      # de las variables obligatorias que falten.
      - path: .env
        required: false
    environment:
      - TZ=${TZ:-Europe/Madrid}

secrets:
  password_corporativo_junta:
    file: ./password_corporativo_junta
  password_geducaand:
    file: ./password_geducaand
